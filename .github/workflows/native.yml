name: Native compiler

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            format: ELF
          - os: ubuntu-24.04-arm
            format: ELF
          - os: macos-15
            format: Mach-O
          - os: macos-15-intel
            format: Mach-O
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev libpolly-19-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
      - name: Install LLVM on macOS
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          brew install llvm@19
          echo "LLVM_SYS_191_PREFIX=$(brew --prefix llvm@19)" >> "$GITHUB_ENV"
      - name: Install LLVM on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          # Homebrew 不再为 Intel macOS 提供 llvm@19 bottle，MacPorts 的二进制镜像
          # 曾出现缺包（libffi 404）。这里直接使用 LLVM 官方发布的 X64 产物。
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-macOS-X64.tar.xz \
            -o "$RUNNER_TEMP/llvm.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
          echo "LLVM_SYS_191_PREFIX=$RUNNER_TEMP/llvm" >> "$GITHUB_ENV"
          # 官方 tarball 的 LLVM 静态库引用 libc++abi 的符号，Rust 链接器不会自动带。
          echo "RUSTFLAGS=-C link-arg=-lc++ -C link-arg=-lc++abi" >> "$GITHUB_ENV"
      - name: Verify executable format and output
        env:
          BINARY_FORMAT: ${{ matrix.format }}
        run: |
          cargo +stable run --locked -p maslang -- build examples/regression/syntax/standalone-hello/main.ms -o "$RUNNER_TEMP/mas-hello"
          file "$RUNNER_TEMP/mas-hello" | grep -F "$BINARY_FORMAT"
          test "$("$RUNNER_TEMP/mas-hello")" = Helloworld
      - name: Run time example with prebuilt objects
        run: cargo +stable run --locked -p fama -- run examples/projects/time-api
      - name: Test workspace
        run: cargo +stable test --workspace --locked --no-fail-fast
