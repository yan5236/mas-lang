name: Native compiler

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            format: ELF
          - os: ubuntu-24.04-arm
            format: ELF
          - os: macos-15
            format: Mach-O
          - os: macos-15-intel
            format: Mach-O
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev libpolly-19-dev libzstd-dev libxml2-dev
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
      - name: Install LLVM on macOS
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          brew install llvm@19
          echo "LLVM_SYS_191_PREFIX=$(brew --prefix llvm@19)" >> "$GITHUB_ENV"
      - name: Install LLVM on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          pkg="$RUNNER_TEMP/macports.pkg"
          curl --fail --silent --show-error --location --retry 3 \
            https://distfiles.macports.org/MacPorts/MacPorts-2.12.7-15-Sequoia.pkg \
            -o "$pkg"
          sudo installer -pkg "$pkg" -target /
          sudo /opt/local/bin/port -N -b install llvm-19
          echo "LLVM_SYS_191_PREFIX=/opt/local/libexec/llvm-19" >> "$GITHUB_ENV"
      - name: Generate Intel macOS time objects
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          cargo +stable run --locked -p fama -- build examples/projects/time-api --allow-native-source-build
          target="$(rustc +stable --print host-tuple)"
          artifacts="examples/projects/time-api/mod_module/time@0.1.0/native/artifacts/$target"
          file "$artifacts/"*.o
          mkdir -p "$RUNNER_TEMP/time-artifacts/$target"
          cp "$artifacts/manifest.toml" "$artifacts/"*.o "$RUNNER_TEMP/time-artifacts/$target/"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && runner.arch == 'X64'
        with:
          name: time-${{ matrix.os }}
          path: ${{ runner.temp }}/time-artifacts/
          if-no-files-found: error
      - name: Verify executable format and output
        env:
          BINARY_FORMAT: ${{ matrix.format }}
        run: |
          cargo +stable run --locked -p maslang -- build examples/regression/syntax/standalone-hello/main.ms -o "$RUNNER_TEMP/mas-hello"
          file "$RUNNER_TEMP/mas-hello" | grep -F "$BINARY_FORMAT"
          test "$("$RUNNER_TEMP/mas-hello")" = Helloworld
      - name: Test workspace
        run: cargo +stable test --workspace --locked --no-fail-fast
